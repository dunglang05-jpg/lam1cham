<script>
(()=>{const $=s=>document.querySelector(s),root=$('.app');const icon=(n,size=18)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#${n}"/></svg>`;const software=[{name:'Google Chrome',desc:'Trình duyệt web',version:'126.0',size:'~110 MB',status:'Khuyến nghị',icon:'🌐',cat:'Internet'},{name:'7-Zip',desc:'Nén và giải nén tệp tin',version:'24.08',size:'~5 MB',status:'Khuyến nghị',icon:'📦',cat:'Tiện ích'},{name:'VLC media player',desc:'Phát video và âm thanh',version:'3.0.21',size:'~40 MB',status:'Khuyến nghị',icon:'🎬',cat:'Đa phương tiện'},{name:'Microsoft PowerToys',desc:'Bộ công cụ nâng cao',version:'0.84.0',size:'~200 MB',status:'Tùy chọn',icon:'🧰',cat:'Tiện ích'},{name:'Notepad++',desc:'Trình soạn thảo mã nguồn',version:'8.6.8',size:'~10 MB',status:'Tùy chọn',icon:'📝',cat:'Lập trình'},{name:'Mozilla Firefox',desc:'Trình duyệt web',version:'128.0',size:'~60 MB',status:'Khuyến nghị',icon:'🦊',cat:'Internet'},{name:'Microsoft 365',desc:'Ứng dụng văn phòng',version:'—',size:'Tùy gói',status:'Tùy chọn',icon:'▦',cat:'Văn phòng'},{name:'Visual Studio Code',desc:'Trình biên tập mã nguồn',version:'1.92',size:'~100 MB',status:'Tùy chọn',icon:'⌘',cat:'Lập trình'}];const names={overview:'Tổng quan',software:'Phần mềm',windows:'Tối ưu Windows',disk:'Ổ đĩa & tài khoản',cleanup:'Dọn dẹp & hiệu năng',handover:'Kiểm tra & bàn giao',modules:'Mô-đun & cập nhật',pro:'Khám phá Pro',settings:'Cài đặt',history:'Nhật ký hoạt động',admin:'Web Admin'};let current='overview',selected=new Set([0,1,2]),tab='Tất cả',cleanupScanned=false,checks=new Set(),toastTimer;const content=$('#content');const head=(eyebrow,title,sub,btn='')=>`<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1 class="h1">${title}</h1><p class="subtitle">${sub}</p></div>${btn}</div>`;const title=(t,e='')=>`<div class="card-title"><span>${t}</span>${e}</div>`;const appIcon=i=>`<span class="app-logo">${software[i].icon}</span>`;
function softwareTable(filtered){return `<div class="table-wrap"><table><thead><tr><th style="width:40px">Chọn</th><th>Phần mềm</th><th>Phiên bản</th><th>Dung lượng</th><th>Đề xuất</th></tr></thead><tbody>${filtered.map(i=>`<tr><td><input class="check sw-check" type="checkbox" data-index="${i}" ${selected.has(i)?'checked':''} aria-label="Chọn ${software[i].name}"></td><td><div class="software-name">${appIcon(i)}<div>${software[i].name}<div class="tiny" style="font-weight:400;margin-top:3px">${software[i].desc}</div></div></div></td><td>${software[i].version}</td><td>${software[i].size}</td><td><span class="tag ${software[i].status==='Khuyến nghị'?'green':'gray'}">${software[i].status}</span></td></tr>`).join('')}</tbody></table></div>`}
function overview(){return `${head('BẢNG ĐIỀU KHIỂN','Xin chào! Sẵn sàng cho laptop mới.','Tất cả công cụ chuẩn bị laptop mới được sắp xếp trong một quy trình đơn giản.','<button class="primary" data-action="start">✦ Bắt đầu thiết lập</button>')}<div class="hero"><section class="welcome"><div class="bubble"></div><div class="bubble2"></div><div class="eyebrow">WORKSPACE / THIẾT BỊ CỦA BẠN</div><h2>Chuẩn bị laptop mới<br>gọn trong một quy trình.</h2><p>Kiểm tra cấu hình, chọn ứng dụng cần thiết và hoàn tất bàn giao có kiểm soát.</p><button class="primary" data-action="start">Khám phá quy trình ${icon('check',15)}</button><div class="hero-icon">${icon('laptop',80)}</div><div class="system-strip"><div class="system"><strong>Windows 11 Pro</strong><span>64-bit · phiên bản mẫu</span></div><div class="system"><strong>RAM · 16 GB</strong><span>Thông tin minh họa</span></div><div class="system"><strong>SSD · 512 GB</strong><span>Ổ đĩa mẫu</span></div></div></section><section class="readiness"><div class="read-glow"></div><div class="small-label">QUY TRÌNH GỢI Ý</div><h3>Một chạm — Sẵn sàng sử dụng.</h3><div class="checkline">${icon('check',14)} Kiểm tra cấu hình thiết bị</div><div class="checkline">${icon('check',14)} Chọn ứng dụng cần thiết</div><div class="checkline">${icon('check',14)} Xem lại thiết lập an toàn</div><div class="checkline">${icon('check',14)} Chuẩn bị biên bản bàn giao</div><button data-action="start">Bắt đầu quy trình　→</button></section></div><div class="section-head"><div class="section-title">Tác vụ nhanh</div><button class="section-link" data-page="modules">Xem tất cả mô-đun →</button></div><div class="grid grid4">${[['box','blue','Cài phần mềm','Chọn ứng dụng cần cài','software'],['shield','green','Tối ưu Windows','Thiết lập an toàn','windows'],['spark','amber','Dọn dẹp máy','Xem trước dung lượng','cleanup'],['clipboard','purple','Kiểm tra & bàn giao','Danh sách kiểm tra cuối','handover']].map(([ic,c,t,d,p])=>`<div class="card action-card"><div class="ic ${c}">${icon(ic,22)}</div><h4>${t}</h4><p>${d}</p><button class="secondary" data-page="${p}">Mở công cụ →</button></div>`).join('')}</div><div class="section-head"><div class="section-title">Tình trạng tổng thể</div><span class="tag green">● Giao diện mẫu</span></div><div class="grid grid2"><div class="card status-card"><div class="ring"><span>85%</span></div><div><div style="font-size:13px;font-weight:800;margin-bottom:8px">Sẵn sàng thiết lập</div><div class="status-list"><span><i></i> Giao diện đã sẵn sàng</span><span><i></i> Danh sách ứng dụng có thể chọn</span><span><i style="background:#f5a623"></i> Tác vụ hệ thống chưa chạy</span></div></div></div><div class="card">${title('Hoạt động gần đây','<span class="tag gray">BẢN DEMO</span>')}<div class="task"><span class="task-state">${icon('check',14)}</span><div class="task-copy"><strong>Không gian làm việc đã mở</strong><small>Thông tin ví dụ · Chưa có tác vụ thực</small></div></div><div class="task"><span class="task-state" style="background:#eaf2ff;color:#2768dc">${icon('box',14)}</span><div class="task-copy"><strong>Danh mục phần mềm sẵn sàng</strong><small>${selected.size} ứng dụng đang chọn trong bản xem trước</small></div></div></div></div>`}
function renderSoftware(){let query=$('#global-search').value.toLowerCase();let filtered=software.map((s,i)=>i).filter(i=>(tab==='Tất cả'||software[i].cat===tab)&&software[i].name.toLowerCase().includes(query));return `${head('THƯ VIỆN ỨNG DỤNG','Phần mềm cần thiết','Chọn các ứng dụng phù hợp với công việc. Đây là danh mục ví dụ, không tải hay cài đặt phần mềm thật.','<button class="primary" data-action="queue">'+icon('download',15)+' Xem hàng đợi</button>')}<div class="toolbar">${['Tất cả','Internet','Tiện ích','Đa phương tiện','Văn phòng','Lập trình'].map(t=>`<button class="pill ${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</div><div class="software-layout"><div class="card" style="padding:0;overflow:hidden">${title('Danh mục ứng dụng','<span class="tag gray">'+filtered.length+' mục</span>').replace('class="card-title"','class="card-title" style="padding:16px 16px 0"')}${softwareTable(filtered)}<div class="note" style="margin:12px">${icon('info',14)} Bản thực tế cần xác minh nguồn tải, chữ ký số và phiên bản trước khi cài đặt.</div></div><aside class="card sticky-card">${title('Danh sách đã chọn')}<div class="tiny">Ứng dụng được đánh dấu để đưa vào hàng đợi mô phỏng.</div><div class="select-count">${selected.size}<span style="font-size:13px;color:var(--muted);font-weight:600"> ứng dụng</span></div><div class="tiny" style="margin:4px 0 13px">Dung lượng ước tính: ~${selected.size*55} MB</div>${[...selected].map(i=>`<div class="selected-row">${appIcon(i)}<div><strong>${software[i].name}</strong><small>${software[i].size}</small></div></div>`).join('')||'<div class="tiny" style="padding:15px 0">Chưa chọn ứng dụng nào.</div>'}<button class="primary" style="width:100%;margin-top:16px" data-action="queue">${icon('download',15)} Tạo hàng đợi</button><button class="secondary" style="width:100%;margin-top:8px" data-action="clear-selection">Bỏ chọn tất cả</button></aside></div>`}
function windows(){let rows=[['shield','Bật các lớp bảo vệ','Giữ Microsoft Defender và tường lửa hoạt động.',true],['spark','Tắt ứng dụng chạy nền không cần thiết','Xem lại từng ứng dụng trước khi thay đổi.',false],['settings','Tối ưu hiệu ứng giao diện','Điều chỉnh theo nhu cầu sử dụng.',false],['history','Giữ Windows Update hoạt động','Không vô hiệu hóa cập nhật bảo mật tự động.',true],['drive','Bật Storage Sense','Hỗ trợ quản lý dung lượng theo cài đặt Windows.',true],['user','Kiểm tra quyền người dùng','Xác minh tài khoản quản trị trước khi thao tác.',true]];return `${head('CẤU HÌNH THIẾT BỊ','Tối ưu Windows','Kiểm tra từng lựa chọn trước khi áp dụng. Không tự động tắt các lớp bảo vệ hệ thống.')}<div class="grid grid2"><section class="card">${title('Thiết lập đề xuất','<span class="tag green">Ưu tiên an toàn</span>')}<div class="toolbar">${['Tất cả','Bảo mật','Hiệu năng','Hệ thống'].map((x,i)=>`<button class="pill ${i===0?'active':''}" data-action="win-tab" data-value="${x}">${x}</button>`).join('')}</div>${rows.map(([ic,t,d,on],i)=>`<div class="setting-row"><div class="ic ${i===0||i===3?'green':'blue'}">${icon(ic,19)}</div><div class="setting-copy"><strong>${t}</strong><small>${d}</small></div><input class="switch" type="checkbox" ${on?'checked':''} aria-label="${t}"></div>`).join('')}<div class="note">${icon('info',14)} Những nút gạt chỉ minh họa trạng thái trong bản xem trước, chưa thay đổi thiết lập Windows.</div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="primary" data-action="preview-windows">Xem lại thay đổi →</button></div></section><section class="card">${title('Trạng thái hệ thống')}<div class="admin-stat"><div class="ic blue">${icon('laptop',23)}</div><div><div style="font-weight:800;font-size:13px">Windows 11</div><div class="tiny">Thông tin thiết bị minh họa</div></div><span class="tag green" style="margin-left:auto">Mẫu</span></div><div style="height:1px;background:var(--line);margin:18px 0"></div><div class="status-list"><span><i></i> Bảo mật Windows: cần xác minh trên máy thật</span><span><i></i> Cập nhật: chưa kiểm tra</span><span><i style="background:#f3ad35"></i> Điểm khôi phục: chưa xác minh</span></div><div style="height:18px"></div>${title('Nguyên tắc an toàn')}<p class="tiny" style="line-height:1.8">• Không tắt Defender hoặc tường lửa theo mặc định.<br>• Không thay đổi khi chưa có xác nhận.<br>• Khuyến nghị điểm khôi phục trước thay đổi quan trọng.<br>• Hiển thị tác động của từng lựa chọn.</p></section></div>`}
function disk(){return `${head('QUẢN LÝ THIẾT BỊ','Ổ đĩa & tài khoản','Tổng hợp thông tin để kỹ thuật viên kiểm tra trước khi bàn giao.','<button class="secondary" data-action="disk-refresh">↻ Làm mới thông tin</button>')}<div class="grid grid2"><section class="card">${title('Dung lượng ổ đĩa','<span class="tag blue">Dữ liệu minh họa</span>')}<div style="display:flex;align-items:center;gap:12px"><div class="ic blue" style="width:47px;height:47px">${icon('drive',24)}</div><div><div style="font-size:15px;font-weight:850">Ổ đĩa hệ thống</div><div class="tiny">Ổ C: · SSD 512 GB (mẫu)</div></div></div><div class="diskbar"><span style="width:68%"></span></div><div style="display:flex;justify-content:space-between;font-size:10px"><span>348 GB đã sử dụng</span><span class="muted">164 GB còn trống</span></div><div style="margin-top:25px">${title('Ổ đĩa dữ liệu')}<div class="diskbar warn"><span style="width:15%"></span></div><div style="display:flex;justify-content:space-between;font-size:10px"><span>Ổ D: · Dữ liệu mẫu</span><span class="muted">15% đã sử dụng</span></div></div><div class="note">${icon('info',14)} Không có thao tác phân vùng, định dạng hay xóa dữ liệu trong bản xem trước.</div></section><section class="card">${title('Tài khoản người dùng')}<div class="setting-row"><div class="ic blue">${icon('user',21)}</div><div class="setting-copy"><strong>Người dùng hiện tại</strong><small>Thông tin minh họa · Không đọc tài khoản Windows thật</small></div><span class="tag green">Ví dụ</span></div><div class="setting-row"><div class="ic purple">${icon('shield',21)}</div><div class="setting-copy"><strong>Quyền quản trị</strong><small>Chưa xác minh trên thiết bị</small></div><span class="tag amber">Cần kiểm tra</span></div><div class="setting-row"><div class="ic cyan">${icon('history',21)}</div><div class="setting-copy"><strong>Kiểm tra mã hóa thiết bị</strong><small>BitLocker hoặc Device Encryption</small></div><span class="tag gray">Chưa kiểm tra</span></div><button class="secondary" style="width:100%;margin-top:15px" data-action="disk-refresh">Kiểm tra lại (mô phỏng)</button></section></div>`}
function cleanup(){return `${head('BẢO TRÌ THIẾT BỊ','Dọn dẹp & hiệu năng','Xem trước các nhóm tệp có thể dọn trước khi xác nhận thao tác.','<button class="primary" data-action="scan-clean">'+icon('search',15)+' Quét thử hệ thống</button>')}<div class="grid grid2"><section class="card">${title('Kết quả phân tích',`<span class="tag ${cleanupScanned?'green':'gray'}">${cleanupScanned?'Mô phỏng hoàn tất':'Chưa quét'}</span>`)}<div style="display:flex;align-items:center;gap:16px;padding:12px 0"><div class="ring" style="background:conic-gradient(#438afa 0 73%,#edf2f8 73% 100%)"><span>${cleanupScanned?'1.2':'—'}<small style="font-size:9px"> GB</small></span></div><div><strong style="font-size:13px">${cleanupScanned?'Có thể xem xét dọn dẹp':'Sẵn sàng quét thử'}</strong><p class="tiny" style="line-height:1.6">${cleanupScanned?'Số liệu minh họa, chưa đọc tệp thật.':'Chọn quét để xem kết quả giả lập và danh sách mẫu.'}</p></div></div>${[['Tệp tạm hệ thống','420 MB'],['Tệp tạm ứng dụng','380 MB'],['Thùng rác','220 MB'],['Cache trình duyệt','150 MB'],['Nhật ký hệ thống','~60 MB']].map((r,i)=>`<div class="setting-row"><input class="check" type="checkbox" ${i<3?'checked':''} ${cleanupScanned?'':'disabled'}><div class="setting-copy"><strong>${r[0]}</strong><small>${cleanupScanned?'Nhóm tệp mô phỏng':'Chưa có dữ liệu quét'}</small></div><span class="tiny">${r[1]}</span></div>`).join('')}<div style="display:flex;gap:8px;margin-top:15px"><button class="secondary" style="flex:1" data-action="scan-clean">Quét lại</button><button class="primary" style="flex:1" data-action="clean-preview">Xem trước dọn dẹp</button></div></section><section class="card">${title('Tùy chọn an toàn')}<p class="tiny" style="line-height:1.7">Các mục dưới đây được thiết kế để cần sự xem xét trước khi dọn. Một số loại dữ liệu có thể quan trọng với công việc hoặc phiên đăng nhập.</p>${[['Bỏ qua tệp cá nhân','Giữ nguyên tài liệu và thư mục người dùng'],['Không xóa mật khẩu đã lưu','Giữ dữ liệu xác thực trình duyệt'],['Giữ nhật ký phục vụ chẩn đoán','Tránh mất thông tin cần xử lý sự cố'],['Xác nhận trước khi dọn','Luôn hiện danh sách trước thao tác']].map(([t,d])=>`<div class="setting-row"><div class="setting-copy"><strong>${t}</strong><small>${d}</small></div><input type="checkbox" class="switch" checked></div>`).join('')}<div class="note">${icon('shield',14)} Bản thật cần có bước xem trước, quyền hủy và ghi nhật ký thao tác.</div></section></div>`}
function handover(){let items=[['windows','Windows và cập nhật','Phiên bản Windows, trạng thái cập nhật'],['box','Phần mềm thiết yếu','Ứng dụng cần thiết được kiểm tra'],['shield','Bảo mật thiết bị','Defender, tường lửa, mã hóa'],['drive','Ổ đĩa & dung lượng','Dung lượng, phân vùng, dữ liệu'],['laptop','Phần cứng & ngoại vi','Camera, âm thanh, Wi-Fi, bàn phím'],['user','Tài khoản & hướng dẫn','Tài khoản, hướng dẫn sử dụng']];let n=checks.size;return `${head('QUY TRÌNH NGHIỆM THU','Kiểm tra & bàn giao','Đánh dấu những mục đã kiểm tra trực tiếp trên laptop.','<button class="primary" data-action="report">'+icon('clipboard',15)+' Tạo báo cáo mẫu</button>')}<div class="grid grid2"><section class="card">${title('Danh sách kiểm tra',`<span class="tag blue">${n}/6 đã đánh dấu</span>`)}<div class="progress" style="height:7px;background:#edf2f8;border-radius:8px;overflow:hidden"><div style="height:100%;background:#2475ee;width:${n/6*100}%;transition:width .2s"></div></div><div style="margin-top:10px">${items.map(([ic,t,d],i)=>`<div class="setting-row"><div class="ic ${i%2?'blue':'green'}">${icon(ic,18)}</div><div class="setting-copy"><strong>${t}</strong><small>${d}</small></div><input class="check handover-check" type="checkbox" data-check="${i}" ${checks.has(i)?'checked':''} aria-label="${t}"></div>`).join('')}</div><div class="note">${icon('info',14)} Đây là checklist thủ công mẫu, không phải kết quả kiểm tra tự động.</div></section><section class="card">${title('Tóm tắt bàn giao')}<div class="ring" style="margin:15px auto 20px;background:conic-gradient(#16b982 ${n/6*100}%,#eaf1fa ${n/6*100}% 100%)"><span>${Math.round(n/6*100)}%</span></div><div style="text-align:center;font-size:14px;font-weight:850">${n===6?'Đã hoàn tất checklist':n===0?'Chưa đánh dấu hạng mục':'Đang kiểm tra'}</div><p class="tiny" style="text-align:center;line-height:1.6;margin:7px 0 20px">Báo cáo mẫu ghi rõ những mục đã xác nhận và mục còn cần kiểm tra.</p><div class="setting-row"><div class="setting-copy"><strong>Biên bản bàn giao</strong><small>Chuẩn bị nội dung mẫu</small></div><span class="tag ${n===6?'green':'amber'}">${n===6?'Sẵn sàng':'Bản nháp'}</span></div><div class="setting-row"><div class="setting-copy"><strong>Xác nhận của kỹ thuật viên</strong><small>Cần thao tác xác nhận trong bản thật</small></div><span class="tag gray">Chưa xác nhận</span></div><button class="primary" style="width:100%;margin-top:15px" data-action="report">${icon('clipboard',15)} Xem báo cáo mẫu</button></section></div>`}
function modules(){return `${head('NỀN TẢNG','Mô-đun & cập nhật','Theo dõi các thành phần phần mềm và những tính năng đang được thiết kế.')}<div class="grid grid3">${[['box','blue','Thư viện ứng dụng','Danh sách và trạng thái gói cài đặt.','Đang thiết kế'],['shield','green','Bộ quy tắc Windows','Quản lý các thiết lập theo hướng an toàn.','Bản xem trước'],['history','purple','Nhật ký hoạt động','Lưu lại hành động và kết quả thực thi.','Bản xem trước'],['puzzle','amber','Hệ thống mô-đun','Mở rộng tính năng theo cấu hình.','Đang thiết kế'],['download','cyan','Cập nhật ứng dụng','Phân phối phiên bản có kiểm tra nguồn.','Chưa kết nối'],['settings','rose','Dịch vụ quản trị','Đồng bộ chính sách từ hệ thống quản trị.','Chưa kết nối']].map(([ic,c,t,d,s])=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><div class="ic ${c}">${icon(ic,21)}</div><span class="tag ${s==='Bản xem trước'?'blue':'gray'}">${s}</span></div><h4 style="font-size:13px;margin:15px 0 6px">${t}</h4><p class="tiny" style="line-height:1.7;min-height:32px">${d}</p><button class="secondary" style="width:100%;margin-top:10px" data-action="module-info">Xem chi tiết</button></div>`).join('')}</div><div class="note">${icon('info',14)} Không có server, kho ứng dụng hoặc dịch vụ cập nhật thực được kết nối trong bản xem trước.</div>`}
function pro(){return `${head('LÀM NHIỀU HƠN','Khám phá Làm 1 Chạm Pro','Thiết kế dành cho đội kỹ thuật cần quy trình thiết lập rõ ràng và có thể kiểm soát.')}<div class="grid grid3"><div class="card plan"><div class="ic blue">${icon('laptop',22)}</div><h3 style="font-size:16px;margin:15px 0 4px">Cá nhân</h3><p class="tiny">Bộ công cụ thiết lập cơ bản.</p><div class="plan-price">Miễn phí</div><ul>${['Quy trình thiết lập cơ bản','Danh sách ứng dụng gợi ý','Checklist bàn giao','Thiết lập an toàn'].map(x=>`<li>${icon('check',14)}${x}</li>`).join('')}</ul><button class="secondary" data-action="plan-free">Đang xem bản miễn phí</button></div><div class="card plan featured"><span class="tag blue">ĐỊNH HƯỚNG PRO</span><div class="ic purple" style="margin-top:15px">${icon('crown',23)}</div><h3 style="font-size:16px;margin:15px 0 4px">Kỹ thuật viên</h3><p class="tiny">Hướng đến đội ngũ kỹ thuật.</p><div class="plan-price">Pro</div><ul>${['Bộ cấu hình theo mẫu','Báo cáo bàn giao nâng cao','Nhật ký tác vụ chi tiết','Quản lý danh mục ứng dụng'].map(x=>`<li>${icon('check',14)}${x}</li>`).join('')}</ul><button class="primary" data-action="pro-demo">Xem kế hoạch Pro</button></div><div class="card plan"><div class="ic amber">${icon('settings',22)}</div><h3 style="font-size:16px;margin:15px 0 4px">Doanh nghiệp</h3><p class="tiny">Quản lý thiết bị tập trung.</p><div class="plan-price">Tùy nhu cầu</div><ul>${['Web Admin tập trung','Chính sách theo nhóm máy','Quản lý phiên bản','Phân quyền và audit log'].map(x=>`<li>${icon('check',14)}${x}</li>`).join('')}</ul><button class="secondary" data-action="enterprise">Tìm hiểu mô hình</button></div></div><div class="note">${icon('info',14)} Các gói trên là định hướng sản phẩm, chưa phải bảng giá thương mại. Bản xem trước chưa có thanh toán, xác thực giấy phép hoặc hệ thống phân quyền thật.</div>`}
function settings(){return `${head('CÁ NHÂN HÓA','Cài đặt ứng dụng','Tuỳ chỉnh giao diện và cách hiển thị thông tin trong bản xem trước.')}<div class="grid grid2"><section class="card">${title('Giao diện')}<div class="setting-row"><div class="setting-copy"><strong>Chủ đề sáng</strong><small>Giao diện sạch, phù hợp môi trường kỹ thuật.</small></div><input class="switch" type="checkbox" checked disabled></div><div class="setting-row"><div class="setting-copy"><strong>Hiển thị nhãn trạng thái</strong><small>Phân biệt khuyến nghị và tùy chọn.</small></div><input class="switch" type="checkbox" checked></div><div class="setting-row"><div class="setting-copy"><strong>Hiệu ứng chuyển trang</strong><small>Chuyển cảnh tinh tế khi mở màn hình.</small></div><input class="switch" type="checkbox" checked></div></section><section class="card">${title('Thông tin ứng dụng')}<div class="setting-row"><div class="ic blue">${icon('laptop',21)}</div><div class="setting-copy"><strong>Làm 1 Chạm</strong><small>Ứng dụng thiết lập laptop mới</small></div><span class="tag blue">Preview</span></div><div class="setting-row"><div class="setting-copy"><strong>Phiên bản giao diện</strong><small>Demo UI · 2026</small></div><span class="tiny">0.1.0</span></div><div class="setting-row"><div class="setting-copy"><strong>Kết nối máy chủ</strong><small>Không có API được kết nối</small></div><span class="tag gray">Offline demo</span></div><div class="note">Thay đổi trong trang này chỉ áp dụng cho bản trình diễn.</div></section></div>`}
function history(){return `${head('MINH BẠCH & KIỂM SOÁT','Nhật ký hoạt động','Những hoạt động hiển thị dưới đây là dữ liệu ví dụ, không phải log hệ thống thực.','<button class="secondary" data-action="clear-log">Làm mới màn hình</button>')}<div class="card">${title('Hoạt động gần đây','<span class="tag gray">DỮ LIỆU MẪU</span>')}<div class="table-wrap"><table><thead><tr><th>Hoạt động</th><th>Phân loại</th><th>Thời điểm</th><th>Trạng thái</th></tr></thead><tbody>${[['Mở trang tổng quan','Giao diện','Vừa xong','Đã hiển thị'],['Xem danh mục phần mềm','Phần mềm','Vừa xong','Bản demo'],['Mở tùy chọn tối ưu','Windows','Vừa xong','Chưa áp dụng'],['Kiểm tra tác vụ dọn dẹp','Bảo trì','Vừa xong','Chưa thực thi']].map(r=>`<tr><td><strong>${r[0]}</strong></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="tag gray">${r[3]}</span></td></tr>`).join('')}</tbody></table></div><div class="note">${icon('info',14)} Bản thật cần ghi rõ người thực hiện, thời gian, kết quả và những thay đổi đã được cho phép.</div></div>`}
function admin(){return `${head('ADMIN CONSOLE','Tổng quan hệ thống','Bản phác thảo Web Admin dành cho quản trị viên và đội hỗ trợ.','<button class="primary" data-action="admin-refresh">↻ Làm mới demo</button>')}<div class="grid grid4">${[['laptop','blue','Thiết bị','125','+12%'],['user','green','Đang hoạt động','109','+8%'],['box','purple','Gói ứng dụng','1.240','+18%'],['shield','amber','Cần chú ý','7','Theo dõi']].map(([ic,c,t,n,d])=>`<div class="card"><div class="admin-stat"><div class="ic ${c}">${icon(ic,21)}</div><div><div class="tiny">${t}</div><div class="metric">${n}</div><div class="tiny" style="color:var(--green)">${d}</div></div></div></div>`).join('')}</div><div class="section-head"><div class="section-title">Quản trị tập trung</div><div class="toolbar" style="margin:0">${['Thiết bị','Danh mục phần mềm','Feature flags','Phát hành','Người dùng','Audit log'].map((x,i)=>`<button class="pill ${i===0?'active':''}" data-action="admin-tab" data-value="${x}">${x}</button>`).join('')}</div></div><div class="grid grid2"><section class="card">${title('Tình trạng thiết bị','<span class="tag gray">MẪU</span>')}<div class="table-wrap"><table><thead><tr><th>Mã thiết bị</th><th>Trạng thái</th><th>Phiên bản</th></tr></thead><tbody>${[['LMC-0142','Hoạt động','1.0.0'],['LMC-0143','Cần kiểm tra','1.0.0'],['LMC-0144','Hoạt động','0.9.8'],['LMC-0145','Ngoại tuyến','1.0.0']].map(r=>`<tr><td><strong>${r[0]}</strong></td><td><span class="tag ${r[1]==='Hoạt động'?'green':r[1]==='Cần kiểm tra'?'amber':'gray'}">${r[1]}</span></td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div></section><section class="card">${title('Hoạt động theo thời gian')}<div class="tiny">Lượt tác vụ minh họa · 7 ngày</div><div class="mini-chart">${[30,52,45,70,58,80,66,92,73,86,62,96].map(h=>`<span style="height:${h}%"></span>`).join('')}</div><div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:9px"><span>Thứ 2</span><span>Thứ 4</span><span>Thứ 6</span><span>Chủ nhật</span></div><div class="note">${icon('shield',14)} Quản trị thật cần đăng nhập, phân quyền, audit log và xác minh quyền tại máy chủ.</div></section></div><div class="note">Web Admin ở đây là bản phác thảo giao diện, dữ liệu hoàn toàn giả lập. Chưa kết nối API, xác thực, cơ sở dữ liệu hoặc hệ thống triển khai thực tế.</div>`}
const pages={overview,software,windows,disk,cleanup,handover,modules,pro,settings,history,admin};function render(){content.innerHTML=(pages[current]||overview)();$('#crumb-current').textContent=names[current]||'Tổng quan';document.querySelectorAll('.nav[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===current))}function go(p){current=p;render();window.scrollTo({top:0,behavior:'smooth'})}function toast(msg){let el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
root.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){go(nav.dataset.page);return}const tabBtn=e.target.closest('[data-tab]');if(tabBtn){tab=tabBtn.dataset.tab;render();return}const act=e.target.closest('[data-action]');if(!act)return;let a=act.dataset.action;if(a==='start'){go('software');toast('Chọn những ứng dụng cần thiết trong danh sách.')}else if(a==='queue')toast('Đã tạo hàng đợi mô phỏng · Chưa cài đặt ứng dụng.') ;else if(a==='clear-selection'){selected.clear();render()}else if(a==='preview-windows')toast('Bản xem trước: chưa có thiết lập Windows nào được thay đổi.') ;else if(a==='scan-clean'){cleanupScanned=true;render();toast('Hoàn tất quét mô phỏng · Không đọc hoặc xóa tệp thật.')}else if(a==='clean-preview')toast(cleanupScanned?'Đã mở bản xem trước · Chưa xóa dữ liệu nào.':'Hãy quét thử trước khi xem danh sách dọn dẹp.') ;else if(a==='report')toast('Bản báo cáo mẫu đã sẵn sàng xem · Chưa tạo tệp thật.') ;else if(a==='disk-refresh')toast('Dữ liệu không kết nối tới ổ đĩa thật.') ;else if(a==='module-info')toast('Mô-đun đang ở giai đoạn thiết kế giao diện.') ;else if(a==='pro-demo')toast('Chưa có hệ thống đăng ký hoặc xác thực giấy phép Pro.') ;else if(a==='plan-free')toast('Bạn đang xem giao diện gói cơ bản.') ;else if(a==='enterprise'){go('admin');toast('Đang xem bản phác thảo Web Admin.')}else if(a==='notifications')toast('Bạn chưa có thông báo mới trong bản demo.') ;else if(a==='help')toast('Trung tâm trợ giúp sẽ được bổ sung trong bản thực tế.') ;else if(a==='clear-log'){go('history');toast('Đã làm mới màn hình nhật ký mẫu.')}else if(a==='admin-refresh'){toast('Dữ liệu quản trị mẫu đã hiển thị lại.');render()}else if(a==='admin-tab'){document.querySelectorAll('[data-action="admin-tab"]').forEach(x=>x.classList.toggle('active',x===act));toast('Đã chọn mục '+act.dataset.value+' · Dữ liệu demo.')}else if(a==='win-tab'){document.querySelectorAll('[data-action="win-tab"]').forEach(x=>x.classList.toggle('active',x===act));toast('Bộ lọc '+act.dataset.value+' là minh họa giao diện.')}});
root.addEventListener('change',e=>{if(e.target.matches('.sw-check')){let i=Number(e.target.dataset.index);e.target.checked?selected.add(i):selected.delete(i);render()}else if(e.target.matches('.handover-check')){let i=Number(e.target.dataset.check);e.target.checked?checks.add(i):checks.delete(i);render()}else if(e.target.matches('.switch'))toast('Đã đổi trạng thái mô phỏng; chưa tác động lên Windows.')});$('#global-search').addEventListener('input',()=>{if(current==='software')render()});render();})();
</script>
</body></html>

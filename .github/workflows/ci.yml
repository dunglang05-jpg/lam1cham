# CI cho Làm 1 Chạm (tài liệu 06): build, test, kiểm tra định dạng và đóng gói EXE portable.
# Không ký số trên PR. Ký số và phát hành chính thức là bước riêng, cần phê duyệt.
name: ci

on:
  push:
    branches: [main]
    # Gắn tag vX.Y.Z trên main để phát hành: build lại từ tag rồi tạo GitHub Release (job release).
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      phat_hanh:
        description: 'Phát hành: nhập phiên bản (vd. 1.0.0) để tạo tag vX.Y.Z và GitHub Release từ commit trên main. Để trống: chỉ build.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test và đóng gói (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Khóa truy cập máy chủ đăng nhập (mô-đun account), nạp vào EXE lúc build. Đặt trong Settings › Secrets › Actions.
      # PR từ fork không có secret: vẫn build/test được, EXE báo chưa cấu hình máy chủ đăng nhập.
      LMC_API_KEY: ${{ secrets.LMC_API_KEY }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cài .NET SDK theo global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Mô-đun account: báo rõ bản build có khóa máy chủ đăng nhập hay không, và khóa có được máy chủ chấp nhận.
      # Không in khóa (GitHub tự che secret trong log). Không làm hỏng build nếu máy chủ tạm không phản hồi.
      - name: Kiểm tra khóa máy chủ đăng nhập
        shell: pwsh
        run: |
          $title = 'Khóa máy chủ đăng nhập'
          if ([string]::IsNullOrWhiteSpace($env:LMC_API_KEY)) {
            Write-Output "::warning title=$title::Chưa có secret LMC_API_KEY. EXE build ra sẽ báo chưa cấu hình máy chủ đăng nhập."
            exit 0
          }
          $endpoint = 'https://dunglam.top/api.php'
          try {
            # So với một khóa chắc chắn sai: máy chủ trả lời khác nhau nghĩa là khóa thật được chấp nhận
            # (không phụ thuộc bảng mã của thông báo tiếng Việt).
            $ask = {
              param($key)
              $body = @{ key = $key; action = 'kiem-tra-khoa' } | ConvertTo-Json -Compress
              (Invoke-RestMethod -Uri $endpoint -Method Post -ContentType 'application/json; charset=utf-8' -Body $body -TimeoutSec 20).message
            }
            $real = & $ask $env:LMC_API_KEY
            $wrong = & $ask ('sai-' + [guid]::NewGuid().ToString('N'))
            if ($real -eq $wrong) {
              Write-Output "::warning title=$title::Máy chủ $endpoint từ chối khóa trong secret LMC_API_KEY. Đối chiếu với API_KEY trong config.php trên hosting."
            } else {
              Write-Output "::notice title=$title::Đã nạp từ secret LMC_API_KEY và máy chủ $endpoint chấp nhận khóa."
            }
          } catch {
            Write-Output "::notice title=$title::Đã nạp từ secret LMC_API_KEY; chưa kiểm tra được với máy chủ ($($_.Exception.Message))."
          }

      # Chỉ khi phát hành: phiên bản trong Directory.Build.props phải trùng tag, có ghi chú phát hành và có khóa máy chủ.
      - name: Kiểm tra trước khi phát hành
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.phat_hanh != '')
        shell: pwsh
        env:
          PHAT_HANH: ${{ inputs.phat_hanh }}
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            if ('${{ github.ref }}' -ne 'refs/heads/main') { Write-Output "::error title=Phát hành::Chỉ phát hành từ nhánh main."; exit 1 }
            $tag = $env:PHAT_HANH.Trim().TrimStart('v')
          } else {
            $tag = '${{ github.ref_name }}'.Substring(1)
          }
          if ($tag -notmatch '^\d+\.\d+\.\d+$') { Write-Output "::error title=Phát hành::Phiên bản '$tag' không đúng dạng X.Y.Z."; exit 1 }
          $props = [xml](Get-Content Directory.Build.props -Raw)
          $ver = @($props.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ($ver -ne $tag) { Write-Output "::error title=Phát hành::Tag v$tag khác Version $ver trong Directory.Build.props."; exit 1 }
          if (-not (Test-Path "docs/release/$tag.md")) { Write-Output "::error title=Phát hành::Thiếu ghi chú docs/release/$tag.md."; exit 1 }
          if ([string]::IsNullOrWhiteSpace($env:LMC_API_KEY)) { Write-Output "::error title=Phát hành::Thiếu secret LMC_API_KEY: EXE sẽ không đăng nhập được."; exit 1 }
          Write-Output "::notice title=Phát hành::Phát hành $tag."

      - name: Restore
        run: dotnet restore LamMotCham.sln

      # Gộp mọi lỗi vào một annotation (GitHub chỉ hiện tối đa 10 annotation lỗi mỗi bước).
      - name: Build (Release, cảnh báo = lỗi)
        shell: pwsh
        run: |
          dotnet build LamMotCham.sln -c Release --no-restore 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $root = "$env:GITHUB_WORKSPACE\"
            $errs = Select-String -Path build.log -Pattern ': error ' |
              ForEach-Object { $_.Line.Trim().Replace($root, '') -replace ' \[[^\]]*\.csproj[^\]]*\]$', '' } |
              Sort-Object -Unique
            $msg = (($errs | Select-Object -First 150) | ForEach-Object { $_.Replace('%', '%25') }) -join '%0A'
            Write-Output "::error title=Build: $($errs.Count) lỗi::$msg"
            exit $code
          }

      - name: Test
        shell: pwsh
        run: |
          dotnet test LamMotCham.sln -c Release --no-build --logger "trx" --logger "console;verbosity=normal" --results-directory artifacts/test-results 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $fails = Select-String -Path test.log -Pattern '^\s*(Failed |error |Error Message|  Assert\.)' -Context 0,3 |
              ForEach-Object { ($_.Line + ' | ' + ($_.Context.PostContext -join ' ')).Trim() } | Select-Object -First 60
            $msg = ($fails | ForEach-Object { $_.Replace('%', '%25') }) -join '%0A'
            Write-Output "::error title=Test thất bại::$msg"
            exit $code
          }

      - name: Kiểm tra định dạng mã
        continue-on-error: true
        run: dotnet format LamMotCham.sln --verify-no-changes --no-restore

      - name: Đóng gói EXE portable
        shell: pwsh
        run: |
          dotnet publish src/LamMotCham.App/LamMotCham.App.csproj -p:PublishProfile=win-x64 2>&1 | Tee-Object -FilePath publish.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $errs = Select-String -Path publish.log -Pattern '(: error |error NU|error NETSDK|error MSB)' |
              ForEach-Object { $_.Line.Trim().Replace("$env:GITHUB_WORKSPACE\", '') } | Sort-Object -Unique
            $msg = (($errs | Select-Object -First 100) | ForEach-Object { $_.Replace('%', '%25') }) -join '%0A'
            Write-Output "::error title=Publish: $($errs.Count) lỗi::$msg"
            exit $code
          }

      - name: Tính SHA-256
        shell: pwsh
        run: |
          $exe = "artifacts/publish/win-x64/LamMotCham.exe"
          if (-not (Test-Path $exe)) { throw "Không tìm thấy $exe" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LamMotCham.exe" | Out-File -Encoding ascii artifacts/publish/win-x64/LamMotCham.exe.sha256
          "SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY
          "Kích thước: {0:N1} MB" -f ((Get-Item $exe).Length / 1MB) >> $env:GITHUB_STEP_SUMMARY

      - name: Tải lên EXE
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LamMotCham-win-x64
          path: |
            artifacts/publish/win-x64/LamMotCham.exe
            artifacts/publish/win-x64/LamMotCham.exe.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Tải lên kết quả test
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 14

  # Tạo GitHub Release từ đúng EXE vừa build và test ở job build (chỉ khi push tag vX.Y.Z).
  release:
    name: Tạo GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.phat_hanh != '' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lấy EXE từ job build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" -n LamMotCham-win-x64 -D dist -R "$GITHUB_REPOSITORY"

      - name: Đối chiếu SHA-256
        working-directory: dist
        run: tr -d '\r' < LamMotCham.exe.sha256 | sha256sum -c -

      # Tag có sẵn (push tag) thì dùng tag đó; chạy tay từ main thì tạo tag vX.Y.Z trỏ đúng commit vừa build.
      - name: Tạo release
        env:
          GH_TOKEN: ${{ github.token }}
          PHAT_HANH: ${{ inputs.phat_hanh }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then v="${PHAT_HANH#v}"; v="${v// /}"; else v="${GITHUB_REF_NAME#v}"; fi
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "::error title=Phát hành::Đã có release v$v."; exit 1; fi
          gh release create "v$v" dist/LamMotCham.exe dist/LamMotCham.exe.sha256 --target "$GITHUB_SHA" \
            --title "Làm 1 Chạm $v" --notes-file "docs/release/$v.md" -R "$GITHUB_REPOSITORY"
